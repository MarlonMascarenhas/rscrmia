# Deploy automático do FORK (MarlonMascarenhas/rscrmia) na VPS, a cada merge na
# main. Entra por SSH e roda hostgator-setup-kit/deploy-fork.sh, que faz backup,
# constrói as imagens na própria VPS e volta a versão anterior se o app não ficar
# saudável. Não roda no upstream nem em fork de fork.
#
# Quem pode mesclar na main passa a poder rodar código como root na VPS.
# Passo a passo e como desligar: docs/runbooks/deploy-automatico-fork.md
name: deploy-vps

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      forcar:
        description: "Refazer o deploy mesmo sem commit novo"
        type: boolean
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'MarlonMascarenhas/rscrmia'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Conferir segredos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          faltam=""
          for nome in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_APP_DIR; do
            if [ -z "${!nome}" ]; then faltam="$faltam $nome"; fi
          done
          if [ -n "$faltam" ]; then
            echo "::error::Segredos faltando (Settings > Secrets and variables > Actions):$faltam"
            exit 1
          fi

      - name: Deploy por SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          FORCAR: ${{ github.event_name == 'workflow_dispatch' && inputs.forcar }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key FIXADA: sem StrictHostKeyChecking=no.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          flag=""
          if [ "$FORCAR" = "true" ]; then flag=" --forcar"; fi
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n bash $VPS_APP_DIR/hostgator-setup-kit/deploy-fork.sh$flag"
